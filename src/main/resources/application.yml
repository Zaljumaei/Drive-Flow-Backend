spring:
  datasource:
    url: jdbc:h2:file:./data/mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console




paging:
  page:
    drivingSchoolPageSize: 50
    instructorPageSize: 20
    studentPageSize: 20
    vehiclePageSize: 20
